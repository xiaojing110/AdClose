name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.idea/**'
      - '!.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '21'
          cache: gradle

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-deps-${{ hashFiles('**/build.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-deps

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ${{ github.workspace }}/app/AdClose.jks
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "No keystore secret configured, will build debug."
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: Build with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            export KEYSTORE_PATH="${{ github.workspace }}/app/AdClose.jks"
            echo "Building with signing config..."
            ./gradlew :app:assembleRelease
          else
            echo "Building without signing (debug keystore)..."
            ./gradlew :app:assembleRelease -x :app:validateSigningRelease || \
            ./gradlew :app:assembleDebug
          fi

      - name: Prepare Release ZIP
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p release
          # Copy APKs
          cp app/build/outputs/apk/release/*.apk release/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk release/ 2>/dev/null || true
          # Copy mapping / proguard
          cp -r app/build/outputs/mapping/ release/mapping/ 2>/dev/null || true
          # Create zip
          cd release && zip -r ../AdClose-v${VERSION}-${GITHUB_SHA:0:7}.zip . && cd ..

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AdClose-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload Release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AdClose-release-${{ github.sha }}
          path: AdClose-*.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AdClose-*.zip
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
